<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Monster Hotel: Room Service</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="Room Service">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2B1838">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --plum:#2B1838; --brass:#E0A93B; --cream:#F6E7C8; --mint:#7FE0B0; }
  html, body {
    margin:0; height:100%; overflow:hidden; background:var(--plum);
    font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif; color:var(--cream);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; }
  #hud {
    position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; font-size:22px; font-weight:700; pointer-events:none;
  }
  #right { display:flex; align-items:center; gap:12px; }
  #pauseBtn {
    pointer-events:auto; width:40px; height:40px; padding:7px; background:rgba(0,0,0,.25);
    border:2px solid var(--cream); border-radius:50%; color:var(--cream); cursor:pointer;
  }
  #pauseBtn svg, .toggle svg { width:100%; height:100%; display:block; }
  .toggles { display:flex; gap:10px; margin-top:14px; }
  .toggle {
    font:inherit; font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:20px; border:2px solid var(--cream); background:rgba(0,0,0,.25);
    color:var(--cream); cursor:pointer;
  }
  .toggle svg { width:20px; height:20px; }
  .toggle.off { opacity:.5; text-decoration:line-through; }
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; background:rgba(43,24,56,.85); padding:24px;
  }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:40px; margin:0 0 4px; color:var(--brass); line-height:1.1; }
  #overlay p { font-size:18px; margin:8px 0; max-width:320px; line-height:1.4; }
  #stats { color:var(--mint); }
  .ico { width:26px; height:26px; vertical-align:-6px; }
  #hearts .ico { width:28px; height:28px; margin-right:2px; }
  .row img { width:36px; height:36px; }
  .skin img { width:56px; height:56px; display:block; margin:0 auto 2px; }
  .skin .n { font-size:15px; font-weight:700; display:block; }
  .skin .c .ico { width:16px; height:16px; display:inline; margin:0; vertical-align:-3px; }
  .item button .ico { width:18px; height:18px; vertical-align:-3px; }
  #legend { margin:10px 0 4px; display:grid; gap:8px; }
  .row { display:flex; align-items:center; gap:8px; font-size:28px;
         background:rgba(0,0,0,.25); border-radius:14px; padding:6px 14px; }
  .row .lbl { font-size:17px; font-weight:700; width:56px; text-align:left; }
  .row.catch .lbl { color:var(--mint); }
  .row.avoid { border:2px solid #E04848; }
  .row.avoid .lbl { color:#FF7070; }
  .row.bonus .lbl { color:var(--brass); }
  #playBtn {
    margin-top:20px; font:inherit; font-size:24px; font-weight:700; padding:14px 32px;
    border:3px solid var(--cream); border-radius:40px; background:var(--brass);
    color:var(--plum); cursor:pointer;
  }
  .btns { display:flex; gap:12px; margin-top:20px; }
  .btns #playBtn { margin-top:0; }
  .ghost {
    font:inherit; font-size:20px; font-weight:700; padding:12px 26px; border-radius:40px;
    border:3px solid var(--brass); background:transparent; color:var(--brass); cursor:pointer;
  }
  .hidden { display:none !important; }
  .adBtns { display:flex; flex-direction:column; gap:10px; margin-top:16px; width:100%; max-width:300px; }
  .adBtn {
    font:inherit; font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 16px; border-radius:30px; border:3px solid var(--cream); background:var(--mint);
    color:var(--plum); cursor:pointer;
  }
  .adBtn svg { width:20px; height:20px; flex-shrink:0; }
  #playBtn, .ghost { white-space:nowrap; }
  .adBtn:disabled { opacity:.5; cursor:default; }
  .adBtn:focus-visible { outline:3px solid var(--brass); outline-offset:4px; }
  .item button.adSmall { background:var(--mint); }
  #shop {
    position:fixed; inset:0; background:var(--plum); overflow-y:auto; text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  }
  #shop h2 { color:var(--brass); font-size:32px; margin:0; }
  #shopBank { font-size:22px; font-weight:700; margin:6px 0 16px; }
  .shopHead { font-size:18px; color:var(--mint); margin:18px 0 8px; }
  .item {
    max-width:420px; margin:0 auto 10px; display:flex; align-items:center; gap:12px;
    background:rgba(0,0,0,.25); border-radius:16px; padding:12px 14px; text-align:left;
  }
  .item .info { flex:1; }
  .item .name { font-size:19px; font-weight:700; }
  .item .desc { font-size:14px; opacity:.85; line-height:1.3; }
  .item .pips { color:var(--brass); letter-spacing:2px; font-size:14px; }
  .item button {
    font:inherit; font-size:16px; font-weight:700; padding:8px 14px; border-radius:20px;
    border:2px solid var(--cream); background:var(--brass); color:var(--plum); cursor:pointer; white-space:nowrap;
  }
  .item button:disabled { background:transparent; color:var(--cream); opacity:.5; cursor:default; }
  .skins { max-width:420px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .skin {
    background:rgba(0,0,0,.25); border-radius:16px; padding:10px 6px; border:2px solid transparent;
    font:inherit; color:var(--cream); cursor:pointer;
  }
  .skin .e { font-size:44px; display:block; }
  .skin .c { font-size:14px; font-weight:700; }
  .skin.on { border-color:var(--mint); }
  .skin.locked .e { filter:grayscale(1) brightness(.6); }
  #shopClose { margin-top:20px; }
  #playBtn:focus-visible, #pauseBtn:focus-visible, .toggle:focus-visible, .ghost:focus-visible, .item button:focus-visible, .skin:focus-visible { outline:3px solid var(--mint); outline-offset:4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="hearts"></span>
  <span id="right"><span id="coins"></span><button id="pauseBtn" class="hidden" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button></span>
</div>
<div id="overlay">
  <h1 id="title">Room Service</h1>
  <p id="msg">Drag to move. Catch orders in a row to build a combo.</p>
  <div id="legend"></div>
  <p id="stats"></p>
  <div class="adBtns">
    <button id="reviveBtn" class="adBtn hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><span>Watch ad: Revive</span></button>
    <button id="doubleBtn" class="adBtn hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><span id="doubleTxt">Watch ad: double coins</span></button>
  </div>
  <div class="btns"><button id="playBtn">Play</button><button id="shopBtn" class="ghost">Shop</button></div>
  <div class="toggles">
    <button id="soundBtn" class="toggle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Sound</span></button>
    <button id="musicBtn" class="toggle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l11-2v12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="3" fill="currentColor"/><circle cx="17.5" cy="15.5" r="3" fill="currentColor"/></svg><span>Music</span></button>
  </div>
</div>
<div id="shop" class="hidden">
  <h2>Hotel shop</h2>
  <div id="shopBank"></div>
  <div id="shopList"></div>
  <button id="shopClose" class="ghost">Back</button>
</div>

const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const heartsEl = $("hearts"), coinsEl = $("coins"), overlay = $("overlay"), statsEl = $("stats");
const titleEl = $("title"), msgEl = $("msg"), playBtn = $("playBtn"), pauseBtn = $("pauseBtn");

const shopBtn = $("shopBtn"), shopEl = $("shop"), shopList = $("shopList");

function playStep(s, t) {
  const bar = Math.floor(s / 8), e = s % 8, r = ROOTS[bar];
  if (e % 2 === 0) note(e % 4 === 0 ? r : r + 7, t, 0.16, "triangle", 0.24);     // tuba-style "oom"
  if (e % 2 === 1) CHORDS[bar].forEach(m => note(m, t, 0.08, "square", 0.012));  // "pah" chords
  if (e === 0 || e === 4) kick(t);
  if (e === 2 || e === 6) noise(t, "highpass", 2500, 0.12, 0.05);                // finger snap
  const m = MELODY[bar][e]; if (m) xylo(m, t);
  if (bar === 3 && e === 4) theremin(t);
}
function stepLen() {
  // music speeds up a little with each rush hour
  const bpm = running ? Math.min(156, 124 + Math.floor(elapsed / RAMP_EVERY) * 6) : 116;
  return 60 / bpm / 2;
}
function scheduler() {
  if (!audio || musicPaused || audio.state !== "running") return;
  if (nextNote < audio.currentTime - 0.2) nextNote = audio.currentTime + 0.05;
  while (nextNote < audio.currentTime + 0.12) {
    playStep(musicStep, nextNote); nextNote += stepLen(); musicStep = (musicStep + 1) % 64;
  }
}
function startMusic() {
  musicPaused = false;
  if (!audio || musicTimer) return;
  nextNote = audio.currentTime + 0.1; musicTimer = setInterval(scheduler, 25);
}

// ---- Sound and music buttons ----
function paintToggles() {
  soundBtn.classList.toggle("off", !soundOn); musicBtn.classList.toggle("off", !musicOn);
  soundBtn.setAttribute("aria-pressed", soundOn); musicBtn.setAttribute("aria-pressed", musicOn);
}
soundBtn.addEventListener("click", () => { soundOn = !soundOn; save("rs_sound", soundOn); paintToggles(); initAudio(); sfx.catch(4); });
musicBtn.addEventListener("click", () => {
  musicOn = !musicOn; save("rs_music", musicOn); paintToggles(); initAudio();
  if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? MUSIC_VOLUME : 0, audio.currentTime, 0.05);
  startMusic();
});
paintToggles();

// ---- Game state ----
let player, items, particles, popups, splats;
let hearts, coins, combo, speed, spawnGap, spawnTimer, elapsed;
let shake, flash, invuln, multPulse, magnetT, slowT, clock = 0, running = false, lastTime;

const mult = () => Math.min(MAX_MULT, 1 + Math.floor(combo / COMBO_STEP));

function reset() {
  player = { x:W/2, y:H-110, targetX:W/2, vx:0, squash:0 };
  items = []; particles = []; popups = []; splats = [];
  hearts = maxHearts(); coins = 0; combo = 0;
  speed = START_SPEED; spawnGap = START_SPAWN; spawnTimer = 0; elapsed = 0;
  shake = 0; flash = 0; invuln = 0; multPulse = 0; magnetT = 0; slowT = 0;
  updateHud();
}
function updateHud() {
  heartsEl.innerHTML = icon("heart").repeat(Math.max(0,hearts)) + icon("heartEmpty").repeat(Math.max(0, maxHearts() - hearts));
  coinsEl.innerHTML = icon("coin") + " " + coins;
}

function spawn() {
  const r = Math.random();
  let kind, emoji, vyMul = 1;
  if (r < GOLD_CHANCE) { kind = "gold"; emoji = GOLD; vyMul = 1.6; }
  else if (elapsed > 8 && r < GOLD_CHANCE + POWER_CHANCE) {
    kind = Math.random() < 0.5 ? "magnet" : "slow"; emoji = kind === "magnet" ? MAGNET : SLOW;
  } else {
    const isBad = Math.random() < Math.min(0.25 + elapsed / 200, 0.5);
    kind = isBad ? "bad" : "good";
    const list = isBad ? BAD : GOOD;
    emoji = list[Math.floor(Math.random() * list.length)];
  }
  items.push({
    x: 30 + Math.random() * (W - 60), y: -40, emoji, kind,
    vy: speed * (0.85 + Math.random() * 0.3) * vyMul,
    rot: Math.random() * 6, spin: (Math.random() - 0.5) * 4
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 120, life: 0.6, color });
  }
}
function popup(x, y, text, color, size=26) { popups.push({ x, y, text, color, size, life: 0.9 }); }

// ---- Controls ----
canvas.addEventListener("pointerdown", e => player.targetX = e.clientX);
canvas.addEventListener("pointermove", e => player.targetX = e.clientX);
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// ---- Visit counter (GoatCounter) ----
// Only runs on your GitHub Page, never on CrazyGames (their dashboard has the stats there).
const COUNTER_SITE = "monsterhotel";
if (location.hostname.endsWith("github.io")) {
  const g = document.createElement("script");
  g.async = true; g.src = "https://gc.zgo.at/count.js";
  g.dataset.goatcounter = "https://" + COUNTER_SITE + ".goatcounter.com/count";
  document.head.appendChild(g);
}
function track(path, title) {
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path, title, event: true }); } catch (e) {}
}

// ---- CrazyGames SDK (ads + gameplay events) ----
// Ads only run on CrazyGames, or in test mode (add ?useLocalSdk=true to the address).
let SDK = null;
const adsOn = () => !!SDK;
(async () => {
  try {
    if (window.CrazyGames && window.CrazyGames.SDK) {
      await window.CrazyGames.SDK.init();
      const env = window.CrazyGames.SDK.environment;
      if (env === "crazygames" || env === "local") SDK = window.CrazyGames.SDK;
    }
  } catch (e) { SDK = null; }
  sdkCall(() => SDK.game.loadingStop());
})();
function sdkCall(fn) { if (!SDK) return; try { fn(); } catch (e) {} }
let adPlaying = false;
function showAd(type, onDone, onFail) {
  if (!SDK || adPlaying) { if (onFail) onFail(); return; }
  adPlaying = true;
  const finish = ok => {
    adPlaying = false;
    if (audio && !document.hidden) audio.resume();      // sound back on
    if (ok) { if (onDone) onDone(); } else if (onFail) onFail();
  };
  try {
    SDK.ad.requestAd(type, {
      adStarted: () => { if (audio) audio.suspend(); },  // silence during the ad
      adFinished: () => finish(true),
      adError: () => finish(false)
    });
  } catch (e) { finish(false); }
}

// ---- Pause ----
function pauseGame() {
  if (!running) return;
  running = false; musicPaused = true; pauseBtn.classList.add("hidden"); sdkCall(() => SDK.game.gameplayStop());
  $("legend").classList.add("hidden"); hideAdBtns();
  titleEl.textContent = "Paused"; msgEl.textContent = "Your run is waiting."; statsEl.textContent = "";
  playBtn.textContent = "Resume"; playBtn.dataset.resume = "1"; shopBtn.classList.add("hidden");
  overlay.classList.remove("hidden");
}
pauseBtn.addEventListener("click", pauseGame);
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((k === "p" || k === "escape") && running) pauseGame();
});
// Pause and go silent when the player switches tabs or apps
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { pauseGame(); if (audio) audio.suspend(); }
  else if (audio && !adPlaying) audio.resume();
});

// Desktop players get a keyboard tip
if (window.matchMedia && matchMedia("(pointer: fine)").matches)
  msgEl.textContent = "Move with the mouse or arrow keys. Catch orders in a row to build a combo. Press P to pause.";

// ---- Update ----
function update(dt) {
  elapsed += dt; clock += dt;
  if (Math.floor(elapsed / RAMP_EVERY) > Math.floor((elapsed - dt) / RAMP_EVERY)) {
    speed *= 1.15; spawnGap = Math.max(0.32, spawnGap * 0.88);
    popup(W/2, H*0.4, "Rush hour!", "#7FE0B0", 34);
  }

  if (keys["arrowleft"] || keys["a"]) player.targetX -= 650 * dt;
  if (keys["arrowright"] || keys["d"]) player.targetX += 650 * dt;
  player.targetX = Math.max(30, Math.min(W - 30, player.targetX));
  const oldX = player.x;
  player.x += (player.targetX - player.x) * Math.min(1, dt * 18);
  player.vx = (player.x - oldX) / dt;
  player.squash = Math.max(0, player.squash - dt * 5);

  shake = Math.max(0, shake - dt * 30);
  flash = Math.max(0, flash - dt * 2.5);
  invuln = Math.max(0, invuln - dt);
  multPulse = Math.max(0, multPulse - dt * 3);
  magnetT = Math.max(0, magnetT - dt);
  slowT = Math.max(0, slowT - dt);

  const idt = slowT > 0 ? dt * 0.5 : dt;   // falling things slow down in Slow-Mo
  spawnTimer -= idt;
  if (spawnTimer <= 0) { spawn(); spawnTimer = spawnGap; }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * idt; it.rot += it.spin * idt;
    const good = it.kind === "good" || it.kind === "gold";
    if (magnetT > 0 && good && it.y < player.y) it.x += (player.x - it.x) * Math.min(1, dt * 4);

    const caught = Math.abs(it.x - player.x) < reach() && Math.abs(it.y - player.y) < 40;
    if (caught && it.kind === "bad" && invuln > 0) continue;   // flickering = safe
    if (caught) {
      items.splice(i, 1);
      if (it.kind === "bad") {
        hearts--; combo = 0; shake = 14; flash = 0.6; invuln = 1;
        burst(it.x, it.y, "#E04848", 14); popup(it.x, it.y - 30, "Ouch!", "#FF7070", 30);
        if (!hintShown) { hintShown = true; save("rs_hint", true);
          popups.push({ x: W/2, y: H*0.45, text: "Avoid the red-glow items!", color: "#FF7070", size: 32, life: 2.5 }); }
        sfx.hit(); navigator.vibrate?.(80);
        updateHud();
        if (hearts <= 0) return gameOver();
      } else if (it.kind === "magnet") {
        magnetT = magnetMax(); burst(it.x, it.y, "#7FE0B0", 12);
        popup(it.x, it.y - 30, "Magnet!", "#7FE0B0", 30); sfx.power();
      } else if (it.kind === "slow") {
        slowT = SLOW_TIME; burst(it.x, it.y, "#8FB8FF", 12);
        popup(it.x, it.y - 30, "Slow-mo!", "#8FB8FF", 30); sfx.power();
      } else {
        const before = mult();
        combo++;
        const m = mult(), gain = m * (it.kind === "gold" ? GOLD_VALUE : 1);
        coins += gain; player.squash = 1;
        if (it.kind === "gold") {
          burst(it.x, it.y, "#FFD54A", 30); shake = 6;
          popup(it.x, it.y - 40, "Golden tip! +" + gain, "#FFD54A", 34); sfx.gold();
        } else {
          burst(it.x, it.y, "#E0A93B", 8); popup(it.x, it.y - 30, "+" + gain, "#F6E7C8"); sfx.catch(combo);
        }
        if (m > before) { multPulse = 1; sfx.levelUp(); }
        updateHud();
      }
    } else if (it.y > H - 70) {
      items.splice(i, 1);
      if (good) {
        splats.push({ x: it.x, emoji: it.emoji, life: 1.2 });
        if (combo >= COMBO_STEP) popup(it.x, H - 100, "Combo lost", "#FF9A70", 22);
        combo = 0; sfx.miss();
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.y -= 60 * dt; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
  for (let i = splats.length - 1; i >= 0; i--) {
    splats[i].life -= dt; if (splats[i].life <= 0) splats.splice(i, 1);
  }
}

// ---- Draw ----
function drawBackground() {
  ctx.fillStyle = "#2B1838"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#351E45"; for (let x = 0; x < W; x += 56) ctx.fillRect(x, 0, 28, H);
  ctx.fillStyle = "#4A2A2A"; ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = "#E0A93B"; ctx.fillRect(0, H - 62, W, 4);
}
function emoji(k, x, y, size, rot=0, sx=1, sy=1, alpha=1) {
  const pic = PIC[k]; if (!pic) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy);
  ctx.drawImage(pic, -size/2, -size/2, size, size); ctx.restore();
}
function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function timerBar(icon, t, max, color, y) {
  if (PIC[icon]) ctx.drawImage(PIC[icon], 14, y - 14, 28, 28); ctx.textAlign = "left";
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(48, y - 6, 110, 12);
  ctx.fillStyle = color; ctx.fillRect(48, y - 6, 110 * (t / max), 12);
  ctx.textAlign = "center";
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawBackground();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  for (const s of splats) emoji(s.emoji, s.x, H - 50, 34, 0, 1.4, 0.5, Math.min(1, s.life));
  for (const it of items) {
    if (it.kind === "gold") glow(it.x, it.y, 40 + Math.sin(clock * 10) * 8, "rgba(255,213,74,.8)");
    if (it.kind === "bad") glow(it.x, it.y, 34, "rgba(224,72,72,.45)");
    if (it.kind === "magnet" || it.kind === "slow") glow(it.x, it.y, 36, "rgba(127,224,176,.6)");
    emoji(it.emoji, it.x, it.y, it.kind === "gold" ? 58 : 52, Math.sin(it.rot) * 0.4);
  }

  // Player: lean with movement, squish on catch, flicker when hit
  const show = invuln <= 0 || Math.floor(invuln * 12) % 2 === 0;
  if (show) {
    if (magnetT > 0) glow(player.x, player.y, 70, "rgba(127,224,176,.35)");
    const lean = Math.max(-0.3, Math.min(0.3, player.vx / 2500));
    const sx = 1 + 0.25 * player.squash, sy = 1 - 0.2 * player.squash;
    ctx.save(); ctx.translate(player.x, player.y + 30); ctx.rotate(lean); ctx.scale(sx, sy);
    const tw = trayW();
    ctx.fillStyle = "#E0A93B"; ctx.fillRect(-tw/2, -70, tw, 8);   // tray
    if (PIC[skin]) ctx.drawImage(PIC[skin], -38, -64, 76, 76);
    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color;
    ctx.font = "700 " + p.size + "px Fredoka, sans-serif"; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // Power-up timers
  let ty = 80;
  if (magnetT > 0) { timerBar(MAGNET, magnetT, magnetMax(), "#7FE0B0", ty); ty += 32; }
  if (slowT > 0) { timerBar(SLOW, slowT, SLOW_TIME, "#8FB8FF", ty); }

  // Combo multiplier
  const m = mult();
  if (m > 1) {
    const size = 48 + multPulse * 30;
    ctx.fillStyle = "#E0A93B"; ctx.font = "700 " + size + "px Fredoka, sans-serif";
    ctx.fillText("×" + m, W / 2, 130);
    ctx.font = "500 16px Fredoka, sans-serif"; ctx.fillStyle = "#F6E7C8";
    ctx.fillText("combo " + combo, W / 2, 170);
  }
  ctx.restore();

  if (slowT > 0) { ctx.fillStyle = "rgba(120,160,255,.12)"; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.fillStyle = "rgba(224,72,72," + flash * 0.35 + ")"; ctx.fillRect(0, 0, W, H); }
}

// ---- Loop ----
function loop(t) {
  if (!running) return;
  const dt = Math.min(0.05, (t - lastTime) / 1000); lastTime = t;
  update(dt);
  if (running) draw();
  requestAnimationFrame(loop);
}
function go() {
  overlay.classList.add("hidden"); pauseBtn.classList.remove("hidden"); running = true;
  sdkCall(() => SDK.game.gameplayStart());
  startMusic(); lastTime = performance.now(); requestAnimationFrame(loop);
}
let banked = 0, revived = false, doubled = false, runsPlayed = 0;
const reviveBtn = $("reviveBtn"), doubleBtn = $("doubleBtn");
function hideAdBtns() { reviveBtn.classList.add("hidden"); doubleBtn.classList.add("hidden"); }
function gameOver() {
  running = false; pauseBtn.classList.add("hidden"); sfx.over(); draw();
  sdkCall(() => SDK.game.gameplayStop());
  const newBest = coins > best;
  if (newBest) { best = coins; save("rs_best", best); }
  bank += coins - banked; banked = coins; save("rs_bank", bank);   // only add coins not already banked
  titleEl.textContent = newBest ? "New best!" : "Checked out!";
  msgEl.textContent = "You earned " + coins + " coins in " + Math.floor(elapsed) + " seconds.";
  showStats(); $("legend").classList.add("hidden");
  // Rewarded ad offers
  hideAdBtns();
  if (adsOn()) {
    if (!revived) reviveBtn.classList.remove("hidden");
    if (!doubled && coins > 0) { $("doubleTxt").textContent = "Watch ad: +" + coins + " coins"; doubleBtn.classList.remove("hidden"); }
  }
  reviveBtn.disabled = doubleBtn.disabled = false;
  playBtn.textContent = "Play again"; delete playBtn.dataset.resume; shopBtn.classList.remove("hidden");
  setTimeout(() => overlay.classList.remove("hidden"), 600);
}
reviveBtn.addEventListener("click", () => {
  initAudio(); reviveBtn.disabled = doubleBtn.disabled = true;
  showAd("rewarded", () => {
    revived = true; hideAdBtns();
    hearts = 1; invuln = 2; combo = 0;
    items = items.filter(it => it.kind !== "bad" && it.y < H * 0.4);   // clear danger so they get a fair restart
    updateHud(); popup(W/2, H*0.45, "Back on duty!", "#7FE0B0", 34);
    go();
  }, () => { reviveBtn.disabled = doubleBtn.disabled = false; msgEl.textContent = "No ad available right now. Try again in a moment."; });
});
doubleBtn.addEventListener("click", () => {
  initAudio(); reviveBtn.disabled = doubleBtn.disabled = true;
  showAd("rewarded", () => {
    doubled = true; hideAdBtns();
    bank += coins; save("rs_bank", bank); sfx.gold();
    msgEl.textContent = "Doubled! You earned " + (coins * 2) + " coins this run.";
    showStats();
  }, () => { reviveBtn.disabled = doubleBtn.disabled = false; msgEl.textContent = "No ad available right now. Try again in a moment."; });
});
function newRun() {
  reset(); banked = 0; revived = false; doubled = false; runsPlayed++; hideAdBtns(); go();
  track("room-service-run", "Room Service: run started");
}
playBtn.addEventListener("click", () => {
  initAudio();
  if (playBtn.dataset.resume) { delete playBtn.dataset.resume; go(); return; }
  // A short ad between runs, every 3rd "Play again" (CrazyGames also limits how often these show)
  if (runsPlayed > 0 && runsPlayed % 3 === 0 && adsOn()) {
    playBtn.disabled = true;
    showAd("midgame", () => { playBtn.disabled = false; newRun(); }, () => { playBtn.disabled = false; newRun(); });
  } else newRun();
});
// ---- Shop ----
function today() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function renderShop() {
  $("shopBank").innerHTML = icon("coin") + " " + bank;
  let h = '<div class="shopHead">Upgrades</div>';
  for (const u of UPGRADES) {
    const lvl = up[u.id], max = u.costs.length, cost = u.costs[lvl];
    const pips = "●".repeat(lvl) + "○".repeat(max - lvl);
    const btn = lvl >= max ? '<button disabled>Maxed</button>'
      : '<button data-buy="' + u.id + '"' + (bank < cost ? " disabled" : "") + '>' + icon("coin") + " " + cost + '</button>';
    h += '<div class="item"><div class="info"><div class="name">' + u.name + '</div><div class="pips">' + pips +
         '</div><div class="desc">' + u.desc + '</div></div>' + btn + '</div>';
  }
  h += '<div class="shopHead">Monsters</div>';
  if (adsOn()) {
    const used = load("rs_spin", "") === today();
    h += '<div class="item"><div class="info"><div class="name">Free monster spin</div><div class="desc">' +
         (used ? "Come back tomorrow for another spin." : "Watch an ad to unlock a random monster.") + '</div></div>' +
         '<button class="adSmall" data-spin="1"' + (used ? " disabled" : "") + '>' + (used ? "Used" : "Watch ad") + '</button></div>';
  }
  h += '<div class="skins">';
  for (const k of SKINS) {
    const has = owned.includes(k.e), on = skin === k.e;
    const label = on ? "Using" : has ? "Use" : icon("coin") + " " + k.cost;
    h += '<button class="skin' + (on ? " on" : "") + (has ? "" : " locked") + '" data-skin="' + k.e + '">' +
         icon(k.e, "") + '<span class="n">' + k.name + '</span><span class="c">' + label + '</span></button>';
  }
  shopList.innerHTML = h + '</div>';
}
shopList.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  initAudio();
  if (b.dataset.spin) {
    b.disabled = true;
    showAd("rewarded", () => {
      save("rs_spin", today());
      const locked = SKINS.filter(k => !owned.includes(k.e));
      if (locked.length) {
        const k = locked[Math.floor(Math.random() * locked.length)];
        owned.push(k.e); skin = k.e; save("rs_skins", owned); save("rs_skin", skin);
        $("shopBank").innerHTML = icon("coin") + " " + bank;
      } else { bank += 300; save("rs_bank", bank); }   // already own them all: 300 coins instead
      sfx.gold(); renderShop(); showStats(); draw();
    }, () => { b.disabled = false; });
    return;
  }
  if (b.dataset.buy) {
    const u = UPGRADES.find(x => x.id === b.dataset.buy), cost = u.costs[up[u.id]];
    if (cost === undefined || bank < cost) return;
    bank -= cost; up[u.id]++; save("rs_bank", bank); save("rs_up", up); sfx.power();
  } else if (b.dataset.skin) {
    const k = SKINS.find(x => x.e === b.dataset.skin);
    if (!owned.includes(k.e)) {
      if (bank < k.cost) { sfx.miss(); return; }
      bank -= k.cost; owned.push(k.e); save("rs_bank", bank); save("rs_skins", owned); sfx.gold();
    }
    skin = k.e; save("rs_skin", skin);
  }
  renderShop(); showStats(); updateHud(); draw();
});
shopBtn.addEventListener("click", () => { renderShop(); shopEl.classList.remove("hidden"); });
$("shopClose").addEventListener("click", () => { shopEl.classList.add("hidden"); updateHud(); draw(); });

reset(); draw();
setTimeout(() => { if (!running) draw(); updateHud(); }, 300);
</script>
